name: azure_iot_hub
description: >-
  A native Dart Azure IoT Hub device SDK with MQTT/TLS and WebSockets,
  SAS and X.509 authentication, telemetry, twins, direct methods and C2D messages.
version: 0.1.0-dev.1
repository: https://github.com/cervm/azure_iot_hub
publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  cancellation_token: ^2.0.1
  crypto: ^3.0.7
  event_bus: ^2.0.1
  mqtt_client:
    git:
      url: https://github.com/cervm/mqtt_client.git
      ref: 29efbfa768dfc23102a07fe159057a898f426810
  typed_data: ^1.4.0
  uuid: ^4.6.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
