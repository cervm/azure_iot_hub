name: azure_iot_hub
description: >-
  Unofficial native Dart device SDK for Azure IoT Hub with MQTT/TLS, WebSockets,
  SAS/X.509 authentication, telemetry, twins, direct methods, C2D messages,
  retries and cancellation.
version: 0.1.0-dev.1
repository: https://github.com/cervm/azure_iot_hub

environment:
  sdk: ^3.13.5

dependencies:
  cancellation_token: ^2.0.1
  crypto: ^3.0.7
  event_bus: ^2.0.1
  mqtt_client: ^10.14.0
  typed_data: ^1.4.0
  uuid: ^4.6.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
